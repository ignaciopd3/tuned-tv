# Ajustes del Fire TV (2026-11-23, elegidos para este perfil). Reversibles: el rollback deja el valor previo.
# Formato: namespace(system|secure|global) clave valor   # motivo

# Privacidad (de dumbtv, data/fireos/settings.txt). Antes estaba todo activado.
secure  amz_limit_ad_tracking                              1      # limita el seguimiento publicitario de Amazon
secure  limit_ad_tracking                                  1
secure  non_amz_limit_ad_tracking                          1      # y el de terceros
secure  advertisingIdApp:interestBasedAds:value            0      # sin anuncios personalizados
secure  USAGE_METRICS_UPLOAD_ENABLED                       0      # no sube datos de uso
secure  usage_metrics_marketing_enabled                    0
secure  settingsApp:appUsageData:value                     0      # «Recopilar datos de uso de apps»: no
secure  settingsApp:deviceUsageData:value                  0      # «Datos de uso del dispositivo»: no

# Pantalla
global  heads_up_notifications_enabled                     0      # sin avisos emergentes encima de lo que se ve
global  com.amazon.tv.settings.featured_item_video_enabled 0      # el inicio de Amazon no reproduce vídeos solo
global  com.amazon.tv.settings.featured_item_video_volume  0.0
global  window_animation_scale                             0.25   # animaciones a un cuarto, como en la TCL
global  transition_animation_scale                         0.25
global  animator_duration_scale                            0.25

# DNS con bloqueo de anuncios y rastreadores (2026-11-23, el mismo que la TCL desde el 2026-11-17): el inicio de Amazon
# metía publicidad (banner de una marca de refrescos) aunque sus paquetes de anuncios ya estuvieran deshabilitados,
# porque la pinta el propio inicio. Hasta cambiar el inicio por el limpio, que no se descarguen.
global  private_dns_mode                                   hostname
global  private_dns_specifier                              p2.freedns.controld.com
#
# Salvapantallas: el reloj del launcher (hora, fecha y tiempo, como en la TCL) en lugar del de Amazon
# (com.amazon.ftv.screensaver, que se queda instalado sin usarse).
secure  screensaver_components                             com.gathin.tvhome/.ClockDream
secure  screensaver_default_component                      com.gathin.tvhome/.ClockDream
# Pero sin salvapantallas del sistema (2026-11-24): al salir de él, Fire OS cierra a la fuerza el paquete del
# salvapantallas (AmazonDreamControllerCallback.forceStopDream, salvo los de Amazon o con «android» en el nombre), que
# es el launcher entero, y se veía el inicio de Amazon con anuncios hasta que volvía. El mismo reloj lo pone el launcher
# tras 3 min en el inicio (home_idle_clock_minutes), y la pantalla sigue encendida hasta el reposo de los 20 min.
secure  screensaver_enabled                                0      # sin salvapantallas del sistema
system  screen_off_timeout                                 1200000  # reposo a los 20 min, como antes (sleep_timeout)
