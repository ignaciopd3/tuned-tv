# Permisos por app (appops) del Fire TV (2026-11-23). Reversibles con --action rollback.
# Amazon protege estos paquetes (pm disable-user responde «Cannot disable a protected package»), así que no se pueden
# deshabilitar sin root. Lo que sí se puede, como hace lockdown.sh de dumbtv: que no trabajen en segundo plano.
com.amazon.device.metrics           RUN_ANY_IN_BACKGROUND   ignore   # métricas del dispositivo
com.amazon.device.crashmanager      RUN_ANY_IN_BACKGROUND   ignore   # informes de fallos a Amazon
com.amazon.device.rdmapplication    RUN_ANY_IN_BACKGROUND   ignore   # gestión remota del aparato
com.amazon.ftvads.deeplinking       RUN_ANY_IN_BACKGROUND   ignore   # enlaces de anuncios
com.amazon.tv.csapp                 RUN_ANY_IN_BACKGROUND   ignore   # atención al cliente remota
com.amazon.device.software.ota      RUN_ANY_IN_BACKGROUND   ignore   # actualizaciones forzadas (decidido quitarlas)
com.amazon.device.software.ota.override RUN_ANY_IN_BACKGROUND ignore
# El segundo permiso de segundo plano, como lockdown.sh de dumbtv. El actualizador, solo con RUN_ANY_IN_BACKGROUND,
# siguió instalando: el 2026-11-23 a las 23:13 actualizó Prime Video, Amazon Kids y Alexa Media Player, y al hacerlo
# reactivó las dos últimas, que estaban deshabilitadas.
com.amazon.device.metrics           RUN_IN_BACKGROUND       ignore
com.amazon.device.crashmanager      RUN_IN_BACKGROUND       ignore
com.amazon.device.rdmapplication    RUN_IN_BACKGROUND       ignore
com.amazon.ftvads.deeplinking       RUN_IN_BACKGROUND       ignore
com.amazon.tv.csapp                 RUN_IN_BACKGROUND       ignore
com.amazon.device.software.ota      RUN_IN_BACKGROUND       ignore
com.amazon.device.software.ota.override RUN_IN_BACKGROUND   ignore
# Con el inicio limpio (2026-11-23). Al abrirla funciona igual; cerrada, no trabaja (Prime Video no se toca: está en
# lib/protected.list):
# WhisperLink permitido (2026-11-24): es el mando de la app Fire TV del móvil, el recambio cuando no está el mando
# (de viaje, por ejemplo). Restringido gastaba un 10 % de CPU menos.
com.amazon.whisperlink.core.android RUN_ANY_IN_BACKGROUND   allow    # mando del móvil (app Fire TV)
