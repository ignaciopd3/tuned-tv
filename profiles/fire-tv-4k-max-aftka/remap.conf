# Inicio limpio en Fire OS (mismo formato y motor que settings.conf).
#
# Fire OS no deja cambiar el inicio: `cmd package set-home-activity` dice «Success» y HOME sigue siendo
# com.amazon.tv.launcher, que Amazon protege (no se puede desactivar). Por eso el launcher (com.gathin.tvhome)
# vigila con su servicio de accesibilidad cuándo aparece el inicio de Amazon y lo sustituye por el suyo
# (stock_home_redirect en launcher/config.json). En Fire OS 7 la tecla de inicio no llega a la accesibilidad;
# basta el aviso de «ventana nueva». Mismo mecanismo que usa dumbtv en este modelo.
#
# Requisito: el launcher instalado (run.py launcher). Deshacer: run.py motor --action rollback.
secure  enabled_accessibility_services  com.gathin.tvhome/.HomeKeyService   # inicio de Amazon → el nuestro
secure  accessibility_enabled           1
#
# Sin esto, al pulsar inicio se ve 5 s el inicio de Amazon (con su publicidad): Android retiene 5 s el arranque de
# apps tras la tecla de inicio. El launcher arranca el suyo con una alarma exacta, que el sistema no retiene, y
# min_futurity=0 hace que la alarma salte al momento (en Android 9 es 5 s por defecto). Es el mismo ajuste que
# dumbtv pone en este modelo; no afecta a nada más que al mínimo de espera de las alarmas exactas.
global  alarm_manager_constants         min_futurity=0   # el inicio limpio sale al instante, sin ver el de Amazon
