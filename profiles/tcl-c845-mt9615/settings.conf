# Ajustes del sistema (Fase 3). Reversibles: el rollback restaura el valor previo o borra la clave.
# Formato: namespace(system|secure|global) clave valor   # motivo   (valor sin espacios)
# Medido en esta TV el 2026-11-17: ver README.md del perfil.

# Fluidez de la interfaz (1.0 de fábrica). 0.25 desde el 2026-11-22: un cuarto de la duración,
# más ágil; con 0 algunas transiciones se rompen.
global  window_animation_scale        0.25         # animaciones de ventanas
global  transition_animation_scale    0.25         # transiciones entre pantallas
global  animator_duration_scale       0.25         # animaciones internas de las apps

# Wi-Fi
global  wifi_scan_always_enabled      0            # sin escaneos de fondo para ubicación (la TV no la necesita)
# wifi_sleep_policy ya está en 2 (nunca dormir el Wi-Fi): óptimo, no se toca.

# HDMI-CEC («T-Link»): venía desactivado. Con él, la consola que se enciende cambia la TV a su HDMI
# (One Touch Play) y la TV sabe qué aparato hay en cada puerto. auto_wakeup y auto_device_off ya estaban en 1.
global  hdmi_control_enabled          1


# Salvapantallas: reloj del launcher (ligero, sin red) en lugar del Ambient de Google (dreamx, que se deshabilita).
secure  screensaver_components        com.gathin.tvhome/.ClockDream
secure  screensaver_default_component com.gathin.tvhome/.ClockDream

# DNS privado cifrado (DoT) con bloqueo de anuncios y rastreadores en toda la TV: ControlD gratuito, perfil p2
# («Ads & Tracking»). Medido desde esta TV (10 pings): ControlD p2 5,3 ms · AdGuard 36 ms · Mullvad adblock 42 ms.
# Antes: dns.google (5,8 ms, sin bloqueo). Alternativa: dns.adguard-dns.com.
global  private_dns_mode              hostname
global  private_dns_specifier         p2.freedns.controld.com
