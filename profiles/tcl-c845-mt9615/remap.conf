# Botones del mando (Fase 4). Mismo formato y motor que settings.conf.
#
# Cómo decide el firmware (TclPhoneWindowManager.handleCustomKey, verificado el 2026-11-17 en AR23):
# - Solo para una lista fija de botones de apps consulta settings global CustomKey_<código> (JSON que lanza
#   TclCustomShortCutKeyManager al momento, sin reiniciar): 4096, 4100, 4101, 4142, 4144, 4163 (los de fábrica).
#   Probado: CustomKey_4144 → una app de IPTV funciona (con component= explícito; el intent implícito
#   MAIN/LEANBACK_LAUNCHER no resuelve). Pero este mando IR no tiene ninguno de esos botones.
# - El botón TCL de este mando envía 4020 y va fijo a TclPhoneWindowManager.startTKey →
#   com.tcl.partnercustomizer/.tkey.TKeyActivity → com.tcl.waterfall.overseas («Coming soon» con waterfall
#   deshabilitado). CustomKey_4020 se ignora (probado y revertido).
# - 4137 va fijo a startDashboard (com.tcl.dashboard); 4159 no tiene acción. Ninguno de los dos consulta CustomKey.
#
# Por eso los botones se remapean con un servicio de accesibilidad, que recibe la tecla antes de que el
# firmware la despache: HomeKeyService del launcher Clean Your TV (com.gathin.tvhome). Los mapeos
# (tecla → app o entrada HDMI) viven en launcher/config.json de este perfil (cleanyourtv tools/theme.sh).
# Button Mapper (flar2.homebutton) se probó y no capta las teclas propias de TCL (40xx): desinstalado.
# Fuera de settings (lo hace cleanyourtv launcher/build-and-install.sh con RESTORE_KEY_SERVICES=1):
#   appops APP_AUTO_START allow y WRITE_SECURE_SETTINGS para que el launcher reactive su servicio si TCL lo suelta.
secure  enabled_accessibility_services  com.gathin.tvhome/.HomeKeyService   # teclas del mando → apps / HDMI
secure  accessibility_enabled           1
#
# Plantilla probada para una tecla de la lista (sustituye <código> y la app):
# global  CustomKey_<código>  {"behavior":[{"appnotinstall":{"intent":"market://details?id=com.example.iptv#Intent;package=com.android.vending;end","type":1},"intent":"#Intent;component=com.example.iptv/com.example.iptv.MainActivity;launchFlags=0x10000000;package=com.example.iptv;end","isGoogle":false,"keyaction":1,"type":1,"windowmutex":""}],"keycode":<código>,"keycodename":"KEYCODE_TCL_X"}
