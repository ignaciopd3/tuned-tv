# Propiedades del sistema, aplicadas con --action optimize y all. Solo el nivel del registro por etiqueta
# (persist.log.tag.<etiqueta>), lo único que Android deja cambiar sin root. Reversibles: el rollback deja lo que había.
# Formato: propiedad nivel   # motivo      (niveles: V, D, I, W, E, F, S)

# Registro de la tele (2026-11-23): el servicio de TV de TCL (sita.*) y el chip MediaTek (MI3)
# escribían ~1.300 líneas por segundo de información que nadie lee. A W solo quedan avisos y errores.
# Medido en la prueba temporal: CPU total de 8,5 % a 7,8 % en reposo; logd de 2,0 % a 0,5 % de un núcleo.
persist.log.tag.sita.soc.System     W
persist.log.tag.sita.soc.Dispout    W
persist.log.tag.sita.common         W
persist.log.tag.MI3                 W
persist.log.tag.sita.soc.PM         W
persist.log.tag.sita.signal         F   # solo repite «formato no soportado 0x0» sin entrada abierta (~50/s), como error

# Tras reiniciar (comprobado el 2026-11-23): sin ninguna entrada HDMI abierta, el servicio pregunta ~100 veces por
# segundo por su estado y lo apunta como aviso («handle is null»). A E solo quedan sus errores.
persist.log.tag.sita.soc.Extin      E
