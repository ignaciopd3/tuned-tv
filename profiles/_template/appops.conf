# Permisos de cada app (appops), aplicados con --action optimize y all. Reversibles: el rollback deja el modo previo.
# Formato: paquete OPERACIÓN modo   # motivo      (modos: allow, ignore, deny, default, foreground)
# Para ver los de una app: adb shell cmd appops get <paquete>
#
# Ejemplo: una app que no debe trabajar en segundo plano mientras no se usa (sigue en memoria y abre igual de rápido)
# com.ejemplo.app   RUN_ANY_IN_BACKGROUND   ignore
