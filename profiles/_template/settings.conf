# Ajustes del sistema (se aplican con --action optimize). Reversibles: el rollback restaura el valor previo.
# Formato: namespace clave valor   # motivo
#   namespace: system | secure | global · valor sin espacios, comilla simple ni «\»
#   el comentario necesita un espacio delante (el valor puede contener «#»)
# Valores actuales: backups/<run>/before/settings.<namespace> tras --action audit.
#
# Punto de partida probado en Google TV:
# global  window_animation_scale       0.5
# global  transition_animation_scale   0.5
# global  animator_duration_scale      0.5
# global  wifi_scan_always_enabled     0
# global  private_dns_mode             hostname
# global  private_dns_specifier        dns.google   # mide antes la latencia desde la TV
