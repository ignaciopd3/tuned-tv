# Botones del mando que el firmware guarda como ajustes (se aplican con --action remap).
# Mismo formato y motor que settings.conf: namespace clave valor   # motivo
#
# Cómo encontrarlos: adb shell 'settings list global | grep -iE "key|button"'
#   TCL: CustomKey_<código> con un JSON cuyo "intent" se lanza al pulsar el botón.
#   Para saber qué código envía un botón: adb logcat | grep -i key   (y púlsalo).
# Usa un intent con componente explícito (component=paquete/actividad): uno implícito
# MAIN/LEANBACK_LAUNCHER no resuelve con startActivity. Prueba con: adb shell input keyevent <código>
