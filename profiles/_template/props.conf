# Propiedades del sistema, aplicadas con --action optimize y all. Solo el nivel del registro por etiqueta
# (persist.log.tag.<etiqueta>), lo único que Android deja cambiar sin root. Reversibles: el rollback deja lo que había.
# Formato: propiedad nivel   # motivo      (niveles: V, D, I, W, E, F, S)
#
# Para ver qué etiquetas escriben más con la tele en reposo:
#   adb shell 'logcat -c; sleep 10; logcat -d -v brief' | sed -n 's/^.\/\([^(]*\)(.*/\1/p' | sort | uniq -c | sort -rn | head
#
# Ejemplo:
# persist.log.tag.EtiquetaRuidosa   W
